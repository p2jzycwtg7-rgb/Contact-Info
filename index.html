<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Business Name</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e1f3b; --navy2:#16305c; --brass:#b8924a; --brass2:#d8b878;
  --bg:#fbfaf7; --surface:#ffffff; --text:#1b2433; --muted:#5b6678; --line:#e3e0d8;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.65;overflow-x:hidden}
h1,h2,h3{font-family:var(--serif);line-height:1.1;font-weight:600}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}

/* Nav */
nav{position:fixed;inset:0 0 auto 0;z-index:50;transition:.4s;padding:18px 0}
nav.solid{background:var(--navy);padding:10px 0;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.logo{font-family:var(--serif);font-size:1.6rem;font-weight:700;color:#fff;letter-spacing:.5px}
.logo span{color:var(--brass2)}
.hero{min-height:100vh;color:#fff;position:relative;overflow:hidden;padding:130px 0 90px;
  background:linear-gradient(135deg,var(--navy),var(--navy2),#0b1a33,var(--navy2));background-size:300% 300%;animation:flow 16s ease infinite}
@keyframes flow{50%{background-position:100% 100%}}
.orb{position:absolute;border-radius:50%;border:1px solid rgba(216,184,120,.35);animation:float 12s ease-in-out infinite;pointer-events:none}
.orb.a{width:420px;height:420px;right:-90px;top:10%}
.orb.b{width:240px;height:240px;right:14%;bottom:6%;animation-delay:-4s;animation-duration:15s}
.orb.c{width:120px;height:120px;left:5%;bottom:12%;animation-delay:-8s;background:rgba(216,184,120,.08)}
@keyframes float{50%{transform:translateY(-34px) rotate(8deg)}}
.hero .wrap{position:relative;z-index:2}
h1{font-size:clamp(2.8rem,8vw,5.5rem);text-align:center;margin-bottom:56px}
h1 .w{display:inline-block;opacity:0;transform:translateY(40px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(50px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv[data-a=left]{transform:translateX(-80px)}
.rv[data-a=right]{transform:translateX(80px)}
.rv.in{opacity:1;transform:none}
#bar{position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,var(--brass),var(--brass2));transform-origin:left;transform:scaleX(var(--p,0));z-index:100}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.cbtn{display:flex;align-items:center;gap:18px;padding:30px 26px;border:1px solid rgba(216,184,120,.4);border-radius:8px;background:rgba(255,255,255,.05);position:relative;overflow:hidden;transition:.35s}
.cbtn::before{content:"";position:absolute;inset:0;background:var(--c,var(--brass));transform:translateX(-101%);transition:transform .45s cubic-bezier(.2,.7,.2,1);z-index:0}
.cbtn:hover::before{transform:none}
.cbtn:hover{transform:translateY(-5px);border-color:transparent;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.cbtn>*{position:relative;z-index:1}
.cbtn svg{width:38px;height:38px;flex:none;fill:currentColor;transition:transform .4s}
.cbtn:hover svg{transform:scale(1.2) rotate(-8deg)}
.cbtn strong{display:block;font-size:1.15rem}
.cbtn small{color:#b9c3d8;transition:.3s}
.cbtn:hover small{color:#fff}
.pulse{animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(216,184,120,.5)}70%{box-shadow:0 0 0 16px rgba(216,184,120,0)}100%{box-shadow:0 0 0 0 rgba(216,184,120,0)}}
.dock{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.dock a,.dock button{width:54px;height:54px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.3);transition:.35s}
.dock svg{width:26px;height:26px;fill:currentColor}
.dock .sub{opacity:0;transform:translateY(20px) scale(.5);pointer-events:none}
.dock.open .sub{opacity:1;transform:none;pointer-events:auto}
.dock a:hover,.dock button:hover{transform:scale(1.12)}
.fab{background:var(--brass);color:#0e1f3b!important}
.dock.open .fab{transform:rotate(45deg)}
footer{background:#081326;color:#8f9bb3;text-align:center;padding:28px 0;font-size:.9rem}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .rv,h1 .w{opacity:1;transform:none}
}
</style>
</head>
<body>
<div id="bar"></div>
<nav id="nav"><div class="wrap"><a href="#top" class="logo" id="logo">Your Business<span>.</span></a></div></nav>
<header class="hero" id="top">
  <div class="orb a" data-speed="-.25"></div><div class="orb b" data-speed="-.5"></div><div class="orb c" data-speed="-.8"></div>
  <div class="wrap">
    <h1 id="headline">Your Business</h1>
    <div class="cgrid" id="cgrid"></div>
  </div>
</header>
<footer>© <span id="yr"></span> <span id="nm"></span></footer>
<div class="dock" id="dock">
  <a class="sub" data-link="messenger" style="background:#0a7cff" aria-label="Messenger"><svg viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.1 2 11.3c0 2.9 1.4 5.5 3.7 7.2V22l3.4-1.9c.9.3 1.9.4 2.9.4 5.5 0 10-4.1 10-9.3S17.500 2 12 2zm1 12.500-2.600-2.800-5 2.800 5.500-5.800 2.600 2.800 5-2.800-5.500 5.800z"/></svg></a>
  <a class="sub" data-link="sms" style="background:#2f9e6b" aria-label="Text message"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 1-2z"/></svg></a>
  <a class="sub" data-link="call" style="background:var(--navy2)" aria-label="Call"><svg viewBox="0 0 24 24"><path d="M6.600 10.800a15 15 0 0 0 6.600 6.600l2.200-2.200a1 1 0 0 1 1-.25 11 11 0 0 0 3.500.56 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.500a1 1 0 0 1 1 1c0 1.200.2 2.400.56 3.500a1 1 0 0 1-.25 1z"/></svg></a>
  <button class="fab pulse" id="fab" aria-label="Contact options" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
</div>

<script>
/* ============ EDIT THIS SECTION FOR EACH CLIENT ============ */
const CONFIG = {
  name: "Your Business",
  phone: "+639171234567",          // international format, no spaces
  phoneLabel: "+63 917 123 4567",
  email: "hello@yourbusiness.com",
  messenger: "yourpage",           // facebook.com/yourpage -> "yourpage"
  instagram: "yourhandle",
  facebook: "yourpage",
  tiktok: "yourhandle",
  whatsapp: "639171234567",        // digits only
  viber: "639171234567",           // digits only
  maps: "https://maps.google.com/?q=Your+Business+Address",
  address: "Your street, City, Province"
};
/* =========================================================== */

const I = { // icon paths (24x24)
 call:'M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11 11 0 0 0 3.5.56 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.2.2 2.4.56 3.5a1 1 0 0 1-.25 1z',
 chat:'M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 1-2z',
 mail:'M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7 8-5H4zm0 2L4 9v8h16V9z',
 pin:'M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z',
 ig:'M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm5 5.500A4.500 4.500 0 1 0 12 16.500 4.500 4.500 0 0 0 12 7.500zm0 2A2.500 2.500 0 1 1 12 14.500 2.500 2.500 0 0 1 12 9.500zM17.500 5.500a1 1 0 1 0 0 2 1 1 0 0 0 0-2z',
 fb:'M14 8V6.500c0-.7.3-1 1-1h2V2h-3c-3 0-4 2-4 4v2H7v3.500h3V22h4v-10.500h3L17.500 8z',
 msg:'M12 2C6.500 2 2 6.100 2 11.300c0 2.900 1.400 5.500 3.700 7.200V22l3.400-1.900c.9.300 1.900.4 2.900.4 5.500 0 10-4.100 10-9.300S17.500 2 12 2z',
 tt:'M16 2h-3v13a3 3 0 1 1-3-3v-3a6 6 0 1 0 6 6V9a7 7 0 0 0 4 1.500v-3A4 4 0 0 1 16 2z',
 wa:'M12 2a10 10 0 0 0-8.600 15L2 22l5.200-1.400A10 10 0 1 0 12 2zm5 14c-.2.600-1.200 1.100-1.700 1.200-.5.100-1 .1-3.300-.8-2.800-1.200-4.600-4-4.700-4.200-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.500-.3.700-.3h.5c.2 0 .4 0 .6.500l.8 2c.1.200.1.400 0 .5l-.4.600c-.2.200-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.100 1 2 1.300 2.300 1.400.3.100.5.100.6-.1l.9-1.100c.2-.3.400-.2.600-.1l1.900.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400z',
 vb:'M12 2C7 2 4 3.500 4 9v3c0 3 1 4.500 3 5v3.500l3.500-3.500H12c5 0 8-1.500 8-7V9c0-5.500-3-7-8-7zm3 13c-3.500-.5-6-3-6.500-6.500 0-.5.500-1 1-1h1l.8 1.800-.8 1c.7 1.500 1.500 2.300 3 3l1-.8 1.800.8v1c0 .4-.5.800-1.300.7z'
};
const L = { // link builders
  call:()=>`tel:${CONFIG.phone}`, sms:()=>`sms:${CONFIG.phone}`, email:()=>`mailto:${CONFIG.email}`,
  messenger:()=>`https://m.me/${CONFIG.messenger}`, instagram:()=>`https://instagram.com/${CONFIG.instagram}`,
  facebook:()=>`https://facebook.com/${CONFIG.facebook}`, tiktok:()=>`https://tiktok.com/@${CONFIG.tiktok}`,
  whatsapp:()=>`https://wa.me/${CONFIG.whatsapp}`, viber:()=>`viber://chat?number=%2B${CONFIG.viber}`, maps:()=>CONFIG.maps
};
const BUTTONS = [ // [key, icon, title, subtitle, hover color]
 ['call','call','Call us',CONFIG.phoneLabel,'#2a5db0'],
 ['messenger','msg','Messenger',CONFIG.messenger,'#0a7cff'],
 ['instagram','ig','Instagram','@'+CONFIG.instagram,'#c13584'],
 ['facebook','fb','Facebook',CONFIG.facebook,'#1877f2'],
 ['whatsapp','wa','WhatsApp',CONFIG.phoneLabel,'#25a244'],
 ['viber','vb','Viber',CONFIG.phoneLabel,'#7360f2'],
 ['tiktok','tt','TikTok','@'+CONFIG.tiktok,'#111111'],
 ['sms','chat','Text message',CONFIG.phoneLabel,'#2f9e6b'],
 ['email','mail','Email',CONFIG.email,'#b8924a'],
 ['maps','pin','Visit us',CONFIG.address,'#c0392b']
];
const grid=document.getElementById('cgrid');
BUTTONS.forEach(([k,ic,t,s,c],i)=>{
  const a=document.createElement('a');
  a.className='cbtn rv'; a.href=L[k](); a.style.setProperty('--c',c); a.style.transitionDelay=(i%4*80)+'ms';
  if(!['call','sms','email'].includes(k)){a.target='_blank';a.rel='noopener'}
  a.innerHTML=`<svg viewBox="0 0 24 24"><path d="${I[ic]}"/></svg><div><strong>${t}</strong><small>${s}</small></div>`;
  grid.appendChild(a);
});
document.querySelectorAll('[data-link]').forEach(a=>{
  a.href=L[a.dataset.link](); if(a.dataset.link==='messenger'){a.target='_blank';a.rel='noopener'}
});
document.title=CONFIG.name;
document.getElementById('logo').innerHTML=CONFIG.name+'<span>.</span>';
document.getElementById('yr').textContent=new Date().getFullYear();
document.getElementById('nm').textContent=CONFIG.name;
const h=document.getElementById('headline');
h.innerHTML=CONFIG.name.split(' ').map((w,i)=>`<span class="w" style="animation-delay:${.15+i*.14}s">${w}</span>`).join(' ');

const nav=document.getElementById('nav');
const dock=document.getElementById('dock'), fab=document.getElementById('fab');
fab.onclick=()=>{const o=dock.classList.toggle('open');fab.setAttribute('aria-expanded',o)};

// Buttons animate in again every time they enter or leave the screen
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
document.querySelectorAll('.cbtn').forEach((c,i)=>c.dataset.a=i%2?'right':'left');
const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('in',e.isIntersecting)),{threshold:.15});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));

// Scroll-linked: progress bar, solid menu bar, parallax rings
const bar=document.getElementById('bar'), par=[...document.querySelectorAll('[data-speed]')];
let tick=false;
function onScroll(){
  const y=scrollY, max=document.documentElement.scrollHeight-innerHeight;
  bar.style.setProperty('--p',max>0?y/max:0);
  nav.classList.toggle('solid',y>40);
  if(!reduce) par.forEach(el=>el.style.translate='0 '+(y*el.dataset.speed)+'px');
  tick=false;
}
addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(onScroll)}},{passive:true});
onScroll();
</script>
</body>
</html>
